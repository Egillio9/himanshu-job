<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Job Sprint Live</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Himanshu's job applications: status, follow-ups and what needs action.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: phone-first single column. Summary (day + counts + needs-you) above a searchable card list. Same palette and type as the main Job Sprint tracker. */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --fg:#17212B; --muted:#5B6673; --line:#DCE1E7;
  --accent:#1F6F5C; --accent-fg:#FFFFFF; --accent-soft:#E1EFEA;
  --warn:#A14E07; --warn-soft:#FCEEDC; --bad:#B42318; --bad-soft:#FBE6E4; --info:#2A56BD; --info-soft:#E5EBF9;
  --font-ui:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-data:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F151B; --surface:#161E26; --fg:#E5EAF0; --muted:#98A4B0; --line:#29343F;
    --accent:#52BE9F; --accent-fg:#0B1A15; --accent-soft:#17342C;
    --warn:#F0A54E; --warn-soft:#382915; --bad:#F2877C; --bad-soft:#3A1D1B; --info:#8DB0F6; --info-soft:#1B2643;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F151B; --surface:#161E26; --fg:#E5EAF0; --muted:#98A4B0; --line:#29343F;
  --accent:#52BE9F; --accent-fg:#0B1A15; --accent-soft:#17342C;
  --warn:#F0A54E; --warn-soft:#382915; --bad:#F2877C; --bad-soft:#3A1D1B; --info:#8DB0F6; --info-soft:#1B2643;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto;padding-block:22px 64px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
.mono{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* header */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head h1{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.head .sub{margin-top:4px;color:var(--muted);font-size:14px}
.clock{text-align:right}
.clock .big{font-family:var(--font-data);font-size:26px;font-weight:600;line-height:1}
.clock .big small{font-size:14px;color:var(--muted);font-weight:400}
.clock .left{font-size:13px;color:var(--muted);margin-top:4px}

/* day strip: applications sent per day */
.stripbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 10px;display:flex;flex-direction:column;gap:8px}
.striphead{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.striphead b{color:var(--fg);font-weight:600}
.strip{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:3px;align-items:end}
.bar{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.bar .n{font-family:var(--font-data);font-size:10.5px;color:var(--muted);height:14px;line-height:14px}
.bar .col{width:100%;max-width:26px;height:56px;background:var(--bg);border-radius:4px;display:flex;align-items:flex-end;overflow:hidden}
.bar .fill{width:100%;background:var(--accent);border-radius:4px 4px 0 0}
.bar .d{font-family:var(--font-data);font-size:10.5px;color:var(--muted)}
.bar.today .d{color:var(--fg);font-weight:600}
.bar.today .col{outline:2px solid var(--accent);outline-offset:1px}
.bar.future .col{opacity:.5}

/* stage counts */
.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.stage{appearance:none;font:inherit;color:inherit;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:1px;min-width:0;cursor:pointer}
.stage .n{font-family:var(--font-data);font-size:24px;font-weight:600;line-height:1.1}
.stage .l{font-size:12.5px;color:var(--muted)}
.stage[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.stage.s-interview .n,.stage.s-touch .n{color:var(--warn)}
.stage.s-offer .n{color:var(--accent)}

/* needs you */
.needs{background:var(--warn-soft);border:1px solid color-mix(in srgb, var(--warn) 35%, transparent);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.needs h2{font-size:16px;color:var(--warn)}
.needs ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.needs li{font-size:14.5px}
.needs li b{font-weight:600}
.needs .when{font-family:var(--font-data);font-size:12px;font-weight:600;color:var(--warn);margin-left:4px;white-space:nowrap}
.needs a{color:var(--info);font-weight:600;text-decoration:none;white-space:nowrap}
.needs a:hover{text-decoration:underline}

/* controls */
.controls{display:flex;flex-direction:column;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-block:-8px}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:15px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .c{font-family:var(--font-data);font-size:11.5px;opacity:.7;margin-left:4px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.count{font-size:13px;color:var(--muted)}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}

/* cards */
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card[data-stage="applied"]{border-left-color:var(--info)}
.card[data-stage="touch"],.card[data-stage="interview"]{border-left-color:var(--warn)}
.card[data-stage="offer"]{border-left-color:var(--accent)}
.card[data-stage="todo"]{border-left-color:var(--muted)}
.card[data-stage="closed"]{opacity:.62;border-left-color:var(--bad)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.top .who{min-width:0}
.co{font-weight:700;font-size:15.5px}
.role{font-size:14px;color:var(--fg)}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:none}
.pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.st-todo{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.st-applied{background:var(--info-soft);color:var(--info)}
.st-touch,.st-interview{background:var(--warn-soft);color:var(--warn)}
.st-offer{background:var(--accent-soft);color:var(--accent)}
.st-closed{background:var(--bad-soft);color:var(--bad)}
.meta{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:13px;color:var(--muted)}
.meta .sal{font-family:var(--font-data);font-size:12.5px}
.note{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.foot .dates{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.due{color:var(--warn);font-weight:600}
.foot a{font-size:13.5px;font-weight:600;color:var(--info);text-decoration:none}
.foot a:hover{text-decoration:underline}
.fit{font-size:11.5px;font-weight:600;color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.more{align-self:center}
.footer{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:14px}
.footer a{color:var(--info)}

@media (max-width:620px){
  .head h1{font-size:26px}
  .clock{text-align:left}
  .stages{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stage .n{font-size:21px}
  .top{flex-direction:column;gap:6px}
  .pills{justify-content:flex-start}
}
@media (max-width:400px){
  .bar .n{font-size:9px}
  .bar .d{font-size:9px}
  .strip{gap:2px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="head">
    <div>
      <div class="eyebrow">Java backend · QA · Product · Chat support</div>
      <h1>Job Sprint</h1>
      <div class="sub">5 Nov → 19 Nov 2026</div>
      <div class="sub">Updated <span class="mono" id="upd"></span></div>
    </div>
    <div class="clock" aria-live="polite">
      <div class="big" id="dayBig">Day – <small>/ 15</small></div>
      <div class="left" id="daysLeft"></div>
    </div>
  </header>

  <section class="stripbox" aria-label="Applications sent per day">
    <div class="striphead"><span>Applications sent per day</span><span><b id="sentTotal">0</b> sent so far</span></div>
    <div class="strip" id="strip"></div>
  </section>

  <section class="stages" id="stages" aria-label="Pipeline by stage"></section>

  <section class="needs" id="needs" aria-labelledby="needsTitle">
    <h2 id="needsTitle">Waiting on you</h2>
    <ol id="needsList"></ol>
  </section>

  <div class="controls">
    <div class="search">
      <input id="q" type="search" placeholder="Search company, role, city, notes" autocomplete="off" aria-label="Search applications">
      <button class="btn" id="clearBtn" type="button" hidden>Clear</button>
    </div>
    <div class="chips" id="trackChips" aria-label="Filter by track"></div>
  </div>
  <div class="count" id="count"></div>
  <div class="list" id="list"></div>
  <button class="btn more" id="moreBtn" type="button" hidden>Show more</button>

  <footer class="footer">
    <span>Updated whenever new applications are logged.</span>
    <span>Public view-only copy. Contact details are hidden.</span>
  </footer>
</div>

<script src="data.js"></script>
<script>
(function(){
  var JD = window.JOB_DATA || {apps:[], todo:[], updated:""};
  var APPS = JD.apps;
  var TODO = JD.todo;
  document.getElementById("upd").textContent = JD.updated;
  var START = new Date(2026, 10, 5), DAYS = 15;
  var STAGE = {"To apply":"todo","Applied":"applied","Referral asked":"applied","Recruiter call":"touch","Interviewing":"interview","Offer":"offer","Rejected":"closed","Closed":"closed"};
  var STAGES = [["todo","To apply"],["applied","Applied"],["touch","Recruiter call"],["interview","Interviewing"],["offer","Offers"],["closed","Closed"]];
  var SORT = {offer:0, interview:1, touch:2, todo:3, applied:4, closed:5};
  var FITS = ["High","Medium","Stretch","Backup"];
  var TRACKS = [["all","All"],["dev","Developer"],["qa","QA / testing"],["product","Product"],["support","Support"]];
  var PAGE = 40;
  var stage = "all", track = "all", query = "", shown = PAGE;

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function iso(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function today(){ var t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
  function addDays(d, n){ var x = new Date(d); x.setDate(x.getDate()+n); return x; }
  function dayIndex(){ return Math.round((today() - START) / 86400000) + 1; }
  function stageOf(a){ return STAGE[a.status] || "todo"; }
  function safeLink(u){ return /^https?:\/\//i.test(u || "") ? u : ""; }
  var MO = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function nice(isoStr){ if (!isoStr) return ""; var p = isoStr.split("-"); return +p[2] + " " + MO[+p[1]-1]; }
  function trackOf(a){
    var id = a.id || "", n = (a.notes || ""), r = (a.role || "").toLowerCase();
    if (/^qa-/.test(id) || /\[QA\]/.test(n) || /\b(qa|test|tester|testing|quality)\b/.test(r)) return "qa";
    if (/^pm-/.test(id) || /\[Product\]/.test(n) || /\b(product|apm|pm)\b/.test(r)) return "product";
    if (/^cs-/.test(id) || /\[(Tech support|Support|Chat)/.test(n) || /support|customer|service desk|chat/.test(r)) return "support";
    return "dev";
  }
  APPS.forEach(function(a){ a._stage = stageOf(a); a._track = trackOf(a); a._hay = [a.company,a.role,a.location,a.source,a.notes,a.status,a.salary].join(" ").toLowerCase(); });

  try { var s = JSON.parse(localStorage.getItem("jsl-filters") || "{}"); if (s.track) track = s.track; if (s.stage) stage = s.stage; } catch(e){}
  function save(){ try { localStorage.setItem("jsl-filters", JSON.stringify({track:track, stage:stage})); } catch(e){} }

  function renderClock(){
    var i = dayIndex();
    if (i > DAYS){ $("dayBig").innerHTML = "Day " + i + " <small>· sprint over</small>"; $("daysLeft").textContent = "Keep going until an offer is signed"; return; }
    if (i < 1){ $("dayBig").innerHTML = "Starts <small>5 Nov</small>"; return; }
    $("dayBig").innerHTML = "Day " + i + " <small>/ 15</small>";
    var left = DAYS - i; $("daysLeft").textContent = left === 0 ? "Last day" : left + (left === 1 ? " day left" : " days left");
  }

  function renderStrip(){
    var per = {}, total = 0;
    APPS.forEach(function(a){ if (a.applied){ per[a.applied] = (per[a.applied] || 0) + 1; } });
    var cells = [], max = 1;
    for (var k = 0; k < DAYS; k++){ var d = addDays(START, k), key = iso(d), n = per[key] || 0; cells.push([d, n]); if (n > max) max = n; total += n; }
    var ti = dayIndex() - 1;
    $("strip").innerHTML = cells.map(function(c, k){
      var h = c[1] ? Math.max(6, Math.round(c[1] / max * 100)) : 0;
      return '<div class="bar' + (k === ti ? ' today' : '') + (k > ti ? ' future' : '') + '" title="' + nice(iso(c[0])) + ': ' + c[1] + ' sent">' +
        '<span class="n">' + (c[1] || "") + '</span><span class="col"><span class="fill" style="height:' + h + '%"></span></span><span class="d">' + c[0].getDate() + '</span></div>';
    }).join("");
    var all = APPS.filter(function(a){ return a.applied; }).length;
    $("sentTotal").textContent = all;
  }

  function renderStages(){
    var counts = {};
    STAGES.forEach(function(s){ counts[s[0]] = 0; });
    APPS.forEach(function(a){ if (track === "all" || a._track === track) counts[a._stage]++; });
    $("stages").innerHTML = STAGES.filter(function(s){ return s[0] !== "closed"; }).map(function(s){
      return '<button type="button" class="stage s-' + s[0] + '" data-stage="' + s[0] + '" aria-pressed="' + (stage === s[0]) + '"><span class="n">' + counts[s[0]] + '</span><span class="l">' + s[1] + '</span></button>';
    }).join("") + '<button type="button" class="stage s-closed" data-stage="closed" aria-pressed="' + (stage === "closed") + '"><span class="n">' + counts.closed + '</span><span class="l">Closed / rejected</span></button>';
  }

  function renderTracks(){
    var counts = {all: APPS.length};
    APPS.forEach(function(a){ counts[a._track] = (counts[a._track] || 0) + 1; });
    $("trackChips").innerHTML = TRACKS.map(function(t){
      return '<button type="button" class="chip" data-track="' + t[0] + '" aria-pressed="' + (track === t[0]) + '">' + t[1] + '<span class="c">' + (counts[t[0]] || 0) + '</span></button>';
    }).join("");
  }

  function renderNeeds(){
    if (!TODO.length){ $("needs").hidden = true; return; }
    $("needsList").innerHTML = TODO.map(function(t){
      var a = t.id ? APPS.find(function(x){ return x.id === t.id; }) : null;
      var link = safeLink(t.link || (a && a.link));
      return '<li><b>' + esc(t.title) + '</b>' + (t.when ? '<span class="when">' + esc(t.when) + '</span>' : '') + '<br><span>' + esc(t.text) + '</span>' + (link ? ' <a href="' + esc(link) + '" target="_blank" rel="noopener">Open ↗</a>' : '') + '</li>';
    }).join("");
  }

  function filtered(){
    var q = query.trim().toLowerCase();
    var rows = APPS.filter(function(a){
      if (track !== "all" && a._track !== track) return false;
      if (stage !== "all" && a._stage !== stage) return false;
      if (stage === "all" && !q && a._stage === "closed") return false;
      if (q && a._hay.indexOf(q) < 0) return false;
      return true;
    });
    rows.sort(function(a, b){
      var s = SORT[a._stage] - SORT[b._stage]; if (s) return s;
      var d = String(b.applied || "").localeCompare(String(a.applied || "")); if (d) return d;
      var f = FITS.indexOf(a.fit) - FITS.indexOf(b.fit); if (f) return f;
      return String(a.company || "").localeCompare(String(b.company || ""));
    });
    return rows;
  }

  function renderList(){
    var rows = filtered(), t = iso(today());
    var closedHidden = (stage === "all" && !query.trim()) ? APPS.filter(function(a){ return a._stage === "closed" && (track === "all" || a._track === track); }).length : 0;
    $("count").textContent = rows.length + (rows.length === 1 ? " application" : " applications") + (closedHidden ? " · " + closedHidden + " closed hidden (tap Closed to see them)" : "");
    if (!rows.length){ $("list").innerHTML = '<div class="empty">Nothing matches. Try another word or clear the filters.</div>'; $("moreBtn").hidden = true; return; }
    $("list").innerHTML = rows.slice(0, shown).map(function(a){
      var link = safeLink(a.link);
      var due = a.next && a.next <= t && (a._stage === "applied" || a._stage === "touch" || a._stage === "interview");
      var dates = [];
      if (a.applied) dates.push("Applied " + nice(a.applied));
      if (a.next && a._stage !== "closed") dates.push((due ? '<span class="due">Follow up ' + nice(a.next) + '</span>' : "Follow up " + nice(a.next)));
      return '<article class="card" data-stage="' + a._stage + '">' +
        '<div class="top"><div class="who"><div class="co">' + esc(a.company) + '</div><div class="role">' + esc(a.role) + '</div></div>' +
          '<div class="pills"><span class="pill st-' + a._stage + '">' + esc(a.status || "To apply") + '</span></div></div>' +
        '<div class="meta"><span>' + esc(a.location || "Location not listed") + '</span>' + (a.salary ? '<span class="sal">' + esc(a.salary) + '</span>' : '') + (a.source ? '<span>' + esc(a.source) + '</span>' : '') + (a.fit ? '<span class="fit">' + esc(a.fit) + ' fit</span>' : '') + '</div>' +
        (a.notes ? '<div class="note">' + esc(a.notes) + '</div>' : '') +
        '<div class="foot"><span class="dates">' + dates.join(" · ") + '</span>' + (link ? '<a href="' + esc(link) + '" target="_blank" rel="noopener">Open job ↗</a>' : '') + '</div>' +
      '</article>';
    }).join("");
    $("moreBtn").hidden = rows.length <= shown;
    $("moreBtn").textContent = "Show " + Math.min(PAGE, rows.length - shown) + " more";
  }

  function renderAll(){ renderStages(); renderTracks(); renderList(); }

  $("stages").addEventListener("click", function(e){
    var b = e.target.closest("[data-stage]"); if (!b) return;
    var s = b.getAttribute("data-stage"); stage = (stage === s) ? "all" : s; shown = PAGE; save(); renderAll();
  });
  $("trackChips").addEventListener("click", function(e){
    var b = e.target.closest("[data-track]"); if (!b) return;
    track = b.getAttribute("data-track"); shown = PAGE; save(); renderAll();
  });
  $("q").addEventListener("input", function(){ query = this.value; shown = PAGE; $("clearBtn").hidden = !query; renderList(); });
  $("clearBtn").addEventListener("click", function(){ query = ""; $("q").value = ""; this.hidden = true; stage = "all"; track = "all"; save(); shown = PAGE; renderAll(); $("q").focus(); });
  $("moreBtn").addEventListener("click", function(){ shown += PAGE; renderList(); });

  renderClock(); renderStrip(); renderNeeds(); renderAll();
})();
</script>

</body>
</html>
